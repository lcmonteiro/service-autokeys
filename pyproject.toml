[project]
name = "autokeys"
version = "0.1.0"
description = "Keyboard driven service to type credentials and run commands from hotkeys."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Luis Monteiro", email = "monteiro.lcm@gmail.com" },
]
dependencies = [
    "pynput>=1.7",
    "pyperclip>=1.8",
    "pyyaml>=5.4",
    "codec-share>=0.1",
]

[project.scripts]
autokeys = "autokeys.service:main"
autokeys-share = "autokeys.shares:main"

[project.urls]
Homepage = "https://github.com/lcmonteiro/service-autokeys"
Repository = "https://github.com/lcmonteiro/service-autokeys"

# -----------------------------------------------------------------------------
# build
# -----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autokeys"]

# -----------------------------------------------------------------------------
# uv
# -----------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# codec-share python package (binding + codec-share.wasm), pinned to a commit until its
# first release, then to the release wheel url
codec-share = { git = "https://github.com/lcmonteiro/codec-share", rev = "6d5b1176fc761637e0e359003cfdbd8d31d48f85" }

[dependency-groups]
dev = [
    "ruff>=0.6",
]

# -----------------------------------------------------------------------------
# lint
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E9", "F"]
# =======================================================================================
# End
# =======================================================================================

[project]
name = "autokeys"
version = "0.1.0"
description = "Keyboard driven service to type credentials and run commands from hotkeys."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Luis Monteiro", email = "monteiro.lcm@gmail.com" },
]
dependencies = [
    "pynput>=1.7",
    "pyperclip>=1.8",
    "pyyaml>=5.4",
]

[project.scripts]
autokeys = "autokeys.service:main"

[project.urls]
Homepage = "https://github.com/lcmonteiro/service-autokeys"
Repository = "https://github.com/lcmonteiro/service-autokeys"

# -----------------------------------------------------------------------------
# build
# -----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autokeys"]

# -----------------------------------------------------------------------------
# uv
# -----------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.6",
]
# =======================================================================================
# End
# =======================================================================================
